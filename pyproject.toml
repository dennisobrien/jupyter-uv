[project]
name = "jupyter-uv"
version = "0.1.0"
description = "A lightweight, reproducible local JupyterLab server managed by uv."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.8.0",
    "jupyter-ai>=2.31.7",
    "jupyterlab>=4.5.0",
    "jupyter-ai-magics>=2.31.7",
    "langchain-anthropic>=0.3.22",
    "langchain-google-genai>=2.1.12",
    "langchain-ollama>=0.3.10",
    "jupyterlab-execute-time>=3.3.0",
    "jupyter-collaboration>=4.0.2",
    "jupyter-mcp-tools>=0.1.4",
    "pycrdt>=0.12.19",
]
